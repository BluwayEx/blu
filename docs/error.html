<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BluWay | Error</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --cyan:#00E5FF;
  --violet:#5B3CFF;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
html,body{ height:100%; overflow:hidden; user-select:none; -webkit-user-select:none; }

.wrap{
  height:100vh; width:100%;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:24px; position:relative;
  background-size:cover; background-position:center; background-repeat:no-repeat;
}

/* Capa oscura sobre el paisaje para que el texto se lea bien */
.overlay{
  position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(4,7,15,.55), rgba(4,7,15,.75));
  z-index:1;
}

.contenido{ position:relative; z-index:2; }

.codigo-error{
  font-size:clamp(3.5rem,10vw,6rem); font-weight:800; color:#fff;
  text-shadow:0 4px 30px rgba(0,0,0,.5); line-height:1;
}
h1{
  color:#fff; font-size:clamp(1.1rem,3vw,1.4rem); font-weight:600; margin-top:14px;
  text-shadow:0 2px 12px rgba(0,0,0,.5);
}
.ref{
  font-family:monospace; font-size:12px; color:#d9dcec; opacity:.75; margin-top:10px;
  text-shadow:0 2px 8px rgba(0,0,0,.5);
}

button.reintentar{
  margin-top:34px; border:none; border-radius:40px; padding:14px 36px; font-size:15px; font-weight:700;
  color:#0A0F2C; cursor:pointer; transition:.3s;
  background:linear-gradient(135deg, var(--cyan), #5be0ff);
  box-shadow:0 10px 22px rgba(0,229,255,.3);
}
button.reintentar:hover{
  transform:translateY(-2px); box-shadow:0 14px 28px rgba(0,229,255,.45);
}

footer{
  position:absolute; bottom:18px; z-index:2; color:#e2e4f2; opacity:.6; font-size:11px; letter-spacing:.4px;
  text-shadow:0 2px 8px rgba(0,0,0,.5);
}
</style>
</head>
<body>

<div class="wrap" id="fondoPaisaje">
  <div class="overlay"></div>

  <div class="contenido">
    <div class="codigo-error">503</div>
    <h1>Error de conexión</h1>
    <div class="ref">Ref: BW-<span id="refCode"></span></div>
  </div>

  <footer>© 2026 BluWay | Sin Límites</footer>
</div>

<script>
document.getElementById("refCode").innerText = Math.floor(100000 + Math.random()*900000);

// Fondo de paisaje aleatorio en cada carga
const seed = Math.floor(Math.random()*1000);
document.getElementById("fondoPaisaje").style.backgroundImage =
  `url('https://picsum.photos/seed/${seed}/1920/1080')`;

// Igual que el resto del sitio: bloquear clic derecho, selección y atajos de inspección
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("selectstart", e => e.preventDefault());
document.addEventListener("keydown", function(e){
  if (
    (e.ctrlKey && ["s","S","u","U","c","C"].includes(e.key)) ||
    (e.ctrlKey && e.shiftKey && ["I","i","J","j","C","c"].includes(e.key)) ||
    e.key === "F12"
  ) e.preventDefault();
});
</script>

</body>
</html>
